[package]
name = "material_3_comics"
version = "0.1.0"
edition = "2021"
description = "A Material 3 manga and comics reader with a library, sources, downloads and tracking, built with egui"
license = "MIT"
repository = "https://github.com/bhimio1/material-3-comics"

[[bin]]
name = "m3-comics"
path = "src/main.rs"

[dependencies]
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "81c14000c29fb3cfefb0b77344b110a518bfed45", features = ["http", "notify"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "rayon"] }
ureq = { version = "2.12", features = ["json", "native-certs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
lru = "0.12"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
anyhow = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.15"

[dev-dependencies]
material-3-ui = { git = "https://github.com/bhimio1/material-3-ui", rev = "81c14000c29fb3cfefb0b77344b110a518bfed45", features = ["http", "notify", "testing"] }
tempfile = "3"

[profile.release]
lto = "thin"
